steps:
  - name: node:20-bookworm
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        corepack enable
        pnpm install --frozen-lockfile
        pnpm --filter @kampus/db generate
        # Additive only. The database now holds the school's own account and its
        # website content, so a reset would destroy real work — new migrations go on
        # top. If a change ever genuinely needs a rebuild, that is a deliberate
        # decision to make at the time, not the default this job reaches for.
        pnpm --filter @kampus/db exec prisma migrate deploy
        pnpm --filter @kampus/db exec prisma migrate status
    secretEnv: ["DATABASE_URL"]
availableSecrets:
  secretManager:
    - versionName: projects/akampuz/secrets/kampus-database-url/versions/latest
      env: "DATABASE_URL"
options:
  logging: CLOUD_LOGGING_ONLY
