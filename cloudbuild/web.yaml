steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/web/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_API_URL=https://kampus-api-953883277229.us-central1.run.app
      - --build-arg
      - NEXT_PUBLIC_SCHOOL_SUBDOMAIN=default
      - -t
      - us-central1-docker.pkg.dev/akampuz/kampus/web:latest
      - .
images: ["us-central1-docker.pkg.dev/akampuz/kampus/web:latest"]
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
