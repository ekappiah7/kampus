steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/marketing/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_API_URL=https://kampus-api-953883277229.us-central1.run.app
      - -t
      - us-central1-docker.pkg.dev/akampuz/kampus/marketing:latest
      - .
images: ["us-central1-docker.pkg.dev/akampuz/kampus/marketing:latest"]
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
